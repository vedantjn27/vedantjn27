<svg xmlns="http://www.w3.org/2000/svg" width="510" height="130" viewBox="0 0 510 130" role="img" aria-labelledby="title description">
  <title id="title">LEARNER animated pixel art</title>
  <desc id="description">The word LEARNER is written one glowing pixel at a time.</desc>
  <defs>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <rect id="pixel" width="12" height="12" rx="2"/>
    <style>
      @keyframes writePixel {
        0%, 5% { opacity: .2; filter: none; }
        10%, 48% { opacity: 1; filter: url(#glow); }
        62%, 100% { opacity: .3; filter: none; }
      }
      .pixel {
        opacity: .2;
        animation: writePixel 6s ease-in-out infinite;
        animation-delay: calc(var(--step) * .055s);
      }
      @media (prefers-reduced-motion: reduce) {
        .pixel { animation: none; opacity: 1; }
      }
    </style>
  </defs>
  <rect width="510" height="130" fill="#0d1117" rx="12"/>
  <use href="#pixel" class="pixel" x="18" y="20" fill="#2d27b0" style="--step:0"/>
  <use href="#pixel" class="pixel" x="18" y="34" fill="#2d27b0" style="--step:1"/>
