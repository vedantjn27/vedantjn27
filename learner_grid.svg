<svg xmlns="http://www.w3.org/2000/svg" width="510" height="130" viewBox="0 0 510 130">
  <defs>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.8); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.65; }
      }
      .L  { fill: #2d27b0; animation: fadeIn 0.4s ease both, pulse 3.5s 0.4s ease-in-out infinite; }
      .E1 { fill: #4a42d8; animation: fadeIn 0.4s 0.08s ease both, pulse 3.5s 0.8s ease-in-out infinite; }
      .A  { fill: #6C63FF; animation: fadeIn 0.4s 0.16s ease both, pulse 3.5s 1.2s ease-in-out infinite; }
      .R1 { fill: #9089ff; animation: fadeIn 0.4s 0.24s ease both, pulse 3.5s 1.6s ease-in-out infinite; }
      .N  { fill: #6C63FF; animation: fadeIn 0.4s 0.32s ease both, pulse 3.5s 2.0s ease-in-out infinite; }
      .E2 { fill: #4a42d8; animation: fadeIn 0.4s 0.40s ease both, pulse 3.5s 2.4s ease-in-out infinite; }
      .R2 { fill: #2d27b0; animation: fadeIn 0.4s 0.48s ease both, pulse 3.5s 2.8s ease-in-out infinite; }
      .em { fill: #161b22; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="510" height="130" fill="#0d1117" rx="12"/>

  <!-- Subtitle -->
  <text x="255" y="118" text-anchor="middle" fill="#30363d" font-size="9" font-family="'Courier New',monospace" letter-spacing="3">✦ VEDANT JAIN • ETERNAL LEARNER ✦</text>

