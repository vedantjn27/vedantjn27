name: Update GitHub README Stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate GitHub stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&hide_border=false&border_radius=14&border_color=6C63FF&bg_color=0D1117&title_color=9B8CFF&icon_color=00D4AA&text_color=F8FAFC
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set portfolio rank display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          stats_file = Path("profile/stats.svg")
          svg = stats_file.read_text(encoding="utf-8")

          updated_svg, replacements = re.subn(
              r"(<text\b[^>]*>)\s*C\s*(</text>)",
              r"\g<1>A+\g<2>",
              svg,
              count=1,
          )

          if replacements != 1:
              raise SystemExit("Could not find the generated C rank in profile/stats.svg")

          stats_file.write_text(updated_svg, encoding="utf-8")
          PY
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&hide_border=false&border_radius=14&border_color=6C63FF&bg_color=0D1117&title_color=9B8CFF&text_color=F8FAFC
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update GitHub statistics" || exit 0
          git push
