<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" preserveAspectRatio="none">
  <defs>
    <linearGradient id="divider-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6C63FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#6C63FF"/>
      <stop offset="50%" stop-color="#00D4AA"/>
      <stop offset="80%" stop-color="#FF6B6B"/>
      <stop offset="100%" stop-color="#FF6B6B" stop-opacity="0"/>
    </linearGradient>
    <filter id="divider-glow" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="4" width="1200" height="2" rx="1" fill="url(#divider-gradient)" filter="url(#divider-glow)"/>
</svg>
